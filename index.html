function captureEventDraft(form){
 if(model.state.role!=="admin"||model.state.page!=="manage")return false;
 const id=form.elements.event.value,saved=model.events().find(e=>e.id===id);if(!saved)return false;
 const values={title:form.elements.title.value,date:form.elements.date.value,text:form.elements.text.value,status:form.elements.status.value};
 const changed=Object.keys(values).some(key=>values[key]!==saved[key]);
 eventDraft=changed||eventValidation?{id,values}:null;return changed;
}

app.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");if(!b||b.disabled)return;e.preventDefault();const action=b.dataset.action;
 try{notice="";let focusTarget=null;if(action==="nav"){focusTarget="screen-title";model.navigate(b.dataset.page);detail=null;if(b.dataset.page!=="manage"){eventDraft=null;eventValidation=null;}}else if(["lesson","event","material","trial","news"].includes(action)){if(action==="material")model.material(b.dataset.id);if(action==="news")model.setNewsRead(b.dataset.id,true);detail={type:action,id:b.dataset.id};}
 else if(action==="timing-demo-stage"){showDemoStageTime=!showDemoStageTime;updateTimingResults();document.getElementById("timing-demo-scenario")?.focus();return;}
 else if(action==="timing-pick"){chooseTimingTeam(b.dataset.id);return;}
 else if(action==="news-read"){model.setNewsRead(b.dataset.id,!model.isNewsRead(b.dataset.id));notice="Отметка новости изменена только в макете.";}
 else if(action==="interest"){model.toggleInterest(b.dataset.id);notice=model.state.interested.includes(b.dataset.id)?"Интерес отмечен только в макете.":"Отметка интереса удалена.";}
 else if(action==="material-access"){const item=model.materials().find(m=>m.id===b.dataset.id);if(!item)throw Error("Материал недоступен");model.setMaterialAvailability(item.id,item.blocked);focusTarget="material-access-"+item.id;notice=item.blocked?"Материал снят с доступа в макете.":"Доступ к демо-материалу восстановлен.";}
 else if(action==="undo"){focusTarget="undo-change";notice=model.undoLastChange()?"Предыдущее время и статус восстановлены в макете.":"В выбранных группах нет изменений для отмены.";}
 else if(action==="close"){closeDetail();return;}else if(action==="reset"){focusTarget="screen-title";model.reset();selectedLessonId=null;selectedAttendanceId=null;selectedEventId=null;eventDraft=null;eventValidation=null;timingQuery="";selectedTimingTeam="";showDemoStageTime=false;detail=null;notice="Демонстрационные данные восстановлены.";}render(focusTarget);}catch(err){notice=err.message;render();}
});
app.addEventListener("input",e=>{if(e.target.id==="timing-search"){timingQuery=e.target.value;selectedTimingTeam="";updateTimingResults();return;}const form=e.target.form;if(form?.id!=="event-form"||e.target.name==="event")return;const changed=captureEventDraft(form);const note=document.getElementById("event-draft-note");if(note)note.hidden=!changed;});
app.addEventListener("change",e=>{
 const t=e.target;try{notice="";
 if(t.id==="studio-group"){selectedStudioGroup=t.value;render("studio-group");}
 else if(t.id==="role"){model.selectRole(t.value);eventDraft=null;eventValidation=null;detail=null;render("role");}
 else if(t.id==="group"){model.selectGroup(t.value);eventDraft=null;eventValidation=null;detail=null;render("group");}
 else if(t.id==="timing-collective"){if(t.value)chooseTimingTeam(t.value);else{selectedTimingTeam="";timingQuery="";const input=document.getElementById("timing-search");if(input)input.value="";updateTimingResults();}}
 else if(t.id==="attendance-lesson"){selectedAttendanceId=t.value;document.getElementById("attendance-rows").innerHTML=attendanceRows(t.value);}
 else if(t.dataset.attendance){const changed=model.attendance(t.dataset.lesson,t.dataset.attendance,t.value);notice=changed?"Демо-отметка сохранена в этом браузере.":"Отметка не изменилась.";document.getElementById("attendance-rows").innerHTML=attendanceRows(t.dataset.lesson);app.querySelector('[role="status"]').textContent=notice;const control=document.getElementById("attendance-"+t.dataset.lesson+"-"+t.dataset.attendance);if(control)control.focus();}
 else if(t.name==="event"){selectedEventId=t.value;eventDraft=null;eventValidation=null;render("event-select");}
 else if(t.name==="lesson"){selectedLessonId=t.value;const l=model.lessons().find(l=>l.id===t.value);const f=t.form;f.elements.time.value=l.time;f.elements.status.value=l.status==="cancelled"?"cancelled":"active";}
 }catch(err){notice=err.message;render();}
});
app.addEventListener("submit",e=>{if(e.target.id==="event-form"){e.preventDefault();const f=e.target;selectedEventId=f.elements.event.value;eventDraft={id:selectedEventId,values:{title:f.elements.title.value,date:f.elements.date.value,text:f.elements.text.value,status:f.elements.status.value}};let focusTarget="save-event";try{const changed=model.updateEvent(selectedEventId,eventDraft.values);eventDraft=null;eventValidation=null;notice=changed?"Событие обновлено только в макете.":"В событии нет новых изменений.";}catch(err){notice="";eventValidation={message:err.message,field:err.field||""};focusTarget={title:"event-title",text:"event-text",date:"event-date",status:"event-status"}[eventValidation.field]||"save-event";}render(focusTarget);return;}if(e.target.id!=="schedule-form")return;e.preventDefault();try{const f=e.target;const changed=model.updateLesson(f.elements.lesson.value,f.elements.time.value,f.elements.status.value);notice=changed?"Расписание обновлено в макете. Изменение видно во всех разделах.":"В расписании нет новых изменений.";}catch(err){notice=err.message;}render("save-lesson");});
app.addEventListener("keydown",e=>{if(!detail)return;if(e.key==="Escape"){e.preventDefault();closeDetail();return;}if(e.key==="Tab"){const dialog=app.querySelector('[role="dialog"]');const list=Array.from(dialog.querySelectorAll('button:not([disabled]),a[href],input,select'));if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();

</script><script src="./install.js" defer></script></body></html>
